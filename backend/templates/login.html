<!--
 *  login.html - Admin login stranica
 * 
 * Forma za prijavu na EdgeAI dashboard
 -->
<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EdgeAI - Prijava</title>
  <link rel="stylesheet" href="../static/style.css">
</head>
<body class="login-page">
  <div class="login-container">
    <div class="login-box">
      <div class="login-header">
        <h1>EdgeAI Dashboard</h1>
        <p>Prijavite se za pristup kontrolnoj ploči</p>
      </div>
      
      {{if .Error}}
      <div class="login-error" role="alert">
        {{.Error}}
      </div>
      {{end}}
      
      <form action="/login" method="POST" class="login-form">
        <div class="form-group">
          <label for="username">Korisničko ime</label>
          <input 
            type="text" 
            id="username" 
            name="username" 
            required 
            autocomplete="username"
            placeholder="Unesite korisničko ime"
          >
        </div>
        
        <div class="form-group">
          <label for="password">Lozinka</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            required 
            autocomplete="current-password"
            placeholder="Unesite lozinku"
          >
        </div>
        
        <button type="submit" class="login-button">Prijava</button>
      </form>
    </div>
  </div>
</body>
</html>
